    <tspan x="242" y="162">                                                </tspan>
    <tspan x="242" dy="7.1">                        -                       </tspan>
    <tspan x="242" dy="7.1">                    ---------                   </tspan>
    <tspan x="242" dy="7.1">                  -------------                 </tspan>
    <tspan x="242" dy="7.1">                -----------------               </tspan>
    <tspan x="242" dy="7.1">                -----------------               </tspan>
    <tspan x="242" dy="7.1">                -----------------               </tspan>
    <tspan x="242" dy="7.1">                        :=                      </tspan>
    <tspan x="242" dy="7.1">                  .:==****=                     </tspan>
    <tspan x="242" dy="7.1">                 .+--*%=--*:                    </tspan>
    <tspan x="242" dy="7.1">                .#++++++-++++###                </tspan>
    <tspan x="242" dy="7.1">                =+++++++-++++###                </tspan>
    <tspan x="242" dy="7.1">                .++++===-+++=###                </tspan>
    <tspan x="242" dy="7.1">                 #=+++++#++#####                </tspan>
    <tspan x="242" dy="7.1">                   *-------==                   </tspan>
    <tspan x="242" dy="7.1">                   +-------==                   </tspan>
    <tspan x="242" dy="7.1">                  #*-------==                   </tspan>
    <tspan x="242" dy="7.1">                    %#####*#:                   </tspan>
    <tspan x="242" dy="7.1">                   %%%###%#%%*                  </tspan>
    <tspan x="242" dy="7.1">                   @@@%%%%%%%@                  </tspan>
    <tspan x="242" dy="7.1">                   @@%%%%@%%%%                  </tspan>
    <tspan x="242" dy="7.1">                  @@@@@%%@%@@@@                 </tspan>
    <tspan x="242" dy="7.1">                 @@@@@%%%@@@@@@@                </tspan>
    <tspan x="242" dy="7.1">               @@@@%%@@%#@%@@@@@%@              </tspan>
    <tspan x="242" dy="7.1">              %@%%@@@%%%@%%@%@@@@@@             </tspan>
    <tspan x="242" dy="7.1">            @@@@%%%#%#+%%@@@@@@%%%@%@           </tspan>
    <tspan x="242" dy="7.1">           @@@@@%%#=*#+#@%#%*%@%=%@%@%          </tspan>
    <tspan x="242" dy="7.1">         %%%@@@@%%%##%####*#*%%#*%%@%@=         </tspan>
    <tspan x="242" dy="7.1">        @@%#@%@@%%%@@%%%*###*@@%#@%%%%%         </tspan>
    <tspan x="242" dy="7.1">      *#%%##@%@@@@@%%%%%*%%%#@%%%@@@@@@:        </tspan>
    <tspan x="242" dy="7.1">     +**#*=%%@@@@@@@@%%%%%%%%@%%@@%#*-.         </tspan>
    <tspan x="242" dy="7.1">    :####--@%@@@@@@@@%@@%%%%%%%%%%##+           </tspan>
    <tspan x="242" dy="7.1">    =%%##.=@%@@@@@@@@@@@%%@@@@%%@#*%#:          </tspan>
    </text>

    <!-- Holographic laser scanline beam -->
    <g>
      <line x1="78" y1="150" x2="406" y2="150" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.85">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,245; 0,0" dur="4.2s" repeatCount="indefinite"/>
      </line>
      <line x1="78" y1="150" x2="406" y2="150" stroke="#a5f3fc" stroke-width="1" stroke-opacity="0.95">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,245; 0,0" dur="4.2s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <rect x="78" y="150" width="328" height="245" rx="14" fill="none" stroke="#22d3ee" stroke-opacity=".35">
   <animate attributeName="stroke-opacity" values=".2;.6;.2" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="78" y="433" fill="#f8fafc" font-family="monospace" font-size="20" font-weight="700">Yash Sharma</text>
  <text x="78" y="460" fill="#a5b4c8" font-family="monospace" font-size="13">Full-Stack &amp; Open Source Dev</text>
  <text x="78" y="489" fill="#67e8f9" font-family="monospace" font-size="12">~/profile $ build --ship</text>
  <text x="78" y="526" fill="#64748b" font-family="monospace" font-size="11">Code. Learn. Build. Repeat.</text>

  <!-- right info panel -->
  <rect x="466" y="88" width="672" height="472" rx="18" fill="url(#panel)" stroke="#64748b" stroke-opacity=".35"/>
  <text x="496" y="120" fill="#67e8f9" font-family="monospace" font-size="12" letter-spacing="2">02 / SYSTEM.INFO</text>
  <text x="496" y="165" fill="#94a3b8" font-family="monospace" font-size="13">$ ./profile.sh</text>
  <text x="496" y="210" fill="#f8fafc" font-family="monospace" font-size="38" font-weight="700">YASH SHARMA</text>
  <text x="498" y="240" fill="#67e8f9" font-family="monospace" font-size="15">Full-Stack Developer · Open Source Contributor · Problem Solver</text>
  <path d="M496 262H1108" stroke="#475569" stroke-opacity=".65"/>
  
  <g font-family="monospace" font-size="13">
   <text x="500" y="294" fill="#64748b">ROLE</text><text x="650" y="294" fill="#e2e8f0">Full-Stack Engineer &amp; Open Source Contributor</text>
   <text x="500" y="328" fill="#64748b">FOCUS</text><text x="650" y="328" fill="#e2e8f0">Scalable Web Apps · Real-Time Systems · DSA</text>
   <text x="500" y="362" fill="#64748b">STACK</text><text x="650" y="362" fill="#e2e8f0">React · Next.js · Node.js · Express · TypeScript · C++</text>
   <text x="500" y="396" fill="#64748b">DATABASE</text><text x="650" y="396" fill="#e2e8f0">MongoDB · Redis · PostgreSQL · MySQL</text>
   <text x="500" y="430" fill="#64748b">HACKATHON</text><text x="650" y="430" fill="#38bdf8">🥈 1st Runner-Up @ Code Conqueror India 2026 (ShareX)</text>
   <text x="500" y="464" fill="#64748b">OPEN SOURCE</text><text x="650" y="464" fill="#34d399">Hacktoberfest 2026 · NSoC · 18+ Merged PRs</text>
  </g>
  
  <path d="M496 488H1108" stroke="#475569" stroke-opacity=".65"/>
  <g font-family="monospace" font-size="12" fill="#94a3b8">
   <text x="500" y="512">PORTFOLIO</text><text x="600" y="512" fill="#38bdf8">yash-sharma.onrender.com</text>
   <text x="500" y="530">GITHUB</text><text x="600" y="530" fill="#67e8f9">github.com/yash-sharmaji</text>
   <text x="500" y="548">STATUS</text><text x="600" y="548" fill="#34d399">● Open to SDE internships &amp; collaborative builds</text>
  </g>
  <rect x="18" y="18" width="1144" height="574" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
 </g>
</svg>