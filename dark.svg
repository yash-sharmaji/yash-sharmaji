<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
 width="1180" height="610" viewBox="0 0 1180 610" role="img"
 aria-label="Yash Sharma, Computer Science undergraduate, full-stack web developer and competitive programmer.">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#101b31"/><stop offset="1" stop-color="#102b3b"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0" stop-color="#7c3aed"/><stop offset=".52" stop-color="#22d3ee"/><stop offset="1" stop-color="#10b981"/>
   <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#1e293b" stop-opacity=".82"/><stop offset="1" stop-color="#0b1526" stop-opacity=".76"/>
  </linearGradient>
  <radialGradient id="glow">
   <stop offset="0" stop-color="#22d3ee" stop-opacity=".20"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
   <path d="M24 0H0V24" fill="none" stroke="#8ba3c7" stroke-opacity=".08" stroke-width="1"/>
  </pattern>
  <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
   <circle cx="2" cy="2" r="1.2" fill="#67e8f9" opacity=".65"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
   <feGaussianBlur stdDeviation="12"/>
  </filter>
  <clipPath id="clip"><rect x="18" y="18" width="1144" height="574" rx="24"/></clipPath>
 </defs>
 <g clip-path="url(#clip)">
  <rect width="1180" height="610" fill="url(#bg)"/>
  <rect width="1180" height="610" fill="url(#grid)"/>
  <circle cx="220" cy="240" r="250" fill="url(#glow)"/>
  <circle cx="1000" cy="470" r="300" fill="url(#glow)" opacity=".65"/>
  <rect x="18" y="18" width="1144" height="574" rx="24" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".8"/>
  <!-- editor chrome -->
  <rect x="18" y="18" width="1144" height="48" fill="#0b1220" fill-opacity=".92"/>
  <circle cx="48" cy="42" r="6" fill="#fb7185"/><circle cx="70" cy="42" r="6" fill="#fbbf24"/><circle cx="92" cy="42" r="6" fill="#34d399"/>
  <text x="124" y="47" fill="#94a3b8" font-family="monospace" font-size="13">yash@developer: ~/profile</text>
  <text x="1088" y="47" fill="#34d399" font-family="monospace" font-size="11" text-anchor="end">● ONLINE</text>
  <!-- left visual panel -->
  <rect x="42" y="88" width="400" height="472" rx="18" fill="url(#panel)" stroke="#5eead4" stroke-opacity=".28"/>
  <text x="68" y="120" fill="#67e8f9" font-family="monospace" font-size="12" letter-spacing="2">01 / VISUAL.IDENTITY</text>
  <rect x="78" y="150" width="328" height="245" rx="14" fill="#081321" stroke="#334155"/>
  <rect x="92" y="164" width="300" height="217" rx="9" fill="url(#dots)" opacity=".55"/>
  <g font-family="monospace" font-weight="700" text-anchor="middle" fill="#a5f3fc">
   <text x="242" y="285" font-size="95" letter-spacing="-9" opacity=".9">YS</text>
   <text x="242" y="315" font-size="11" letter-spacing="4" fill="#67e8f9">BUILD / LEARN / SHIP</text>
  </g>
  <rect x="78" y="150" width="328" height="245" rx="14" fill="none" stroke="#22d3ee" stroke-opacity=".28">
   <animate attributeName="stroke-opacity" values=".15;.55;.15" dur="5s" repeatCount="indefinite"/>
  </rect>
  <path d="M78 218H406" stroke="#67e8f9" stroke-opacity=".18">
   <animateTransform attributeName="transform" type="translate" values="0 -60;0 240" dur="7s" repeatCount="indefinite"/>
  </path>
  <text x="78" y="433" fill="#f8fafc" font-family="monospace" font-size="20" font-weight="700">Yash Sharma</text>
  <text x="78" y="460" fill="#a5b4c8" font-family="monospace" font-size="13">Computer Science Undergraduate</text>
  <text x="78" y="489" fill="#67e8f9" font-family="monospace" font-size="12">~/profile $ build --ship</text>
  <text x="78" y="526" fill="#64748b" font-family="monospace" font-size="11">Curious mind. Practical builder.</text>
  <!-- right info panel -->
  <rect x="466" y="88" width="672" height="472" rx="18" fill="url(#panel)" stroke="#64748b" stroke-opacity=".35"/>
  <text x="496" y="120" fill="#67e8f9" font-family="monospace" font-size="12" letter-spacing="2">02 / SYSTEM.INFO</text>
  <text x="496" y="173" fill="#94a3b8" font-family="monospace" font-size="13">$ ./profile.sh</text>
  <text x="496" y="225" fill="#f8fafc" font-family="monospace" font-size="42" font-weight="700">YASH SHARMA</text>
  <text x="498" y="256" fill="#67e8f9" font-family="monospace" font-size="16">Full-Stack Web Developer · Competitive Programmer</text>
  <path d="M496 282H1108" stroke="#475569" stroke-opacity=".65"/>
  <g font-family="monospace" font-size="13">
   <text x="500" y="319" fill="#64748b">FOCUS</text><text x="650" y="319" fill="#e2e8f0">Web applications · Problem solving</text>
   <text x="500" y="355" fill="#64748b">FRONTEND</text><text x="650" y="355" fill="#e2e8f0">HTML · CSS · JavaScript · React</text>
   <text x="500" y="391" fill="#64748b">BACKEND</text><text x="650" y="391" fill="#e2e8f0">Node.js · Express · REST APIs</text>
   <text x="500" y="427" fill="#64748b">EXPLORING</text><text x="650" y="427" fill="#e2e8f0">Next.js · TypeScript · Tailwind CSS</text>
   <text x="500" y="463" fill="#64748b">LANGUAGES</text><text x="650" y="463" fill="#e2e8f0">C · C++ · Java · JavaScript</text>
  </g>
  <path d="M496 486H1108" stroke="#475569" stroke-opacity=".65"/>
  <g font-family="monospace" font-size="12" fill="#94a3b8">
   <text x="500" y="520">GITHUB</text><text x="570" y="520" fill="#67e8f9">github.com/yash-sharmaji</text>
   <text x="500" y="542">STATUS</text><text x="570" y="542" fill="#34d399">● Learning, building &amp; contributing</text>
  </g>
  <rect x="18" y="18" width="1144" height="574" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
 </g>
</svg>