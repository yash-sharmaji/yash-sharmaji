<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
 width="1180" height="610" viewBox="0 0 1180 610" role="img"
 aria-label="Yash Sharma — Full-Stack Developer, Open Source Contributor and Competitive Programmer.">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#ffffff"/><stop offset=".58" stop-color="#f1f7ff"/><stop offset="1" stop-color="#e7f7fb"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0" stop-color="#7c3aed"/><stop offset=".52" stop-color="#0891b2"/><stop offset="1" stop-color="#059669"/>
   <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#ffffff" stop-opacity=".94"/><stop offset="1" stop-color="#f8fbff" stop-opacity=".92"/>
  </linearGradient>
  <radialGradient id="glow">
   <stop offset="0" stop-color="#06b6d4" stop-opacity=".16"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
   <path d="M24 0H0V24" fill="none" stroke="#64748b" stroke-opacity=".09" stroke-width="1"/>
  </pattern>
  <clipPath id="clip"><rect x="18" y="18" width="1144" height="574" rx="24"/></clipPath>
  <clipPath id="avatar-clip"><rect x="78" y="150" width="328" height="245" rx="14"/></clipPath>
  <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
   <feGaussianBlur stdDeviation="2.5" result="blur"/>
   <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
 </defs>
 <g clip-path="url(#clip)">
  <rect width="1180" height="610" fill="url(#bg)"/><rect width="1180" height="610" fill="url(#grid)"/>
  <circle cx="220" cy="240" r="250" fill="url(#glow)"/><circle cx="1000" cy="470" r="300" fill="url(#glow)" opacity=".7"/>
  <rect x="18" y="18" width="1144" height="574" rx="24" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
  
  <!-- editor chrome -->
  <rect x="18" y="18" width="1144" height="48" fill="#eaf1fa" fill-opacity=".96"/>
  <circle cx="48" cy="42" r="6" fill="#fb7185"/><circle cx="70" cy="42" r="6" fill="#fbbf24"/><circle cx="92" cy="42" r="6" fill="#34d399"/>
  <text x="124" y="47" fill="#475569" font-family="monospace" font-size="13">yash@developer: ~/profile</text>
  <text x="1088" y="47" fill="#059669" font-family="monospace" font-size="11" text-anchor="end">● ONLINE</text>
  
  <!-- left visual panel -->
  <rect x="42" y="88" width="400" height="472" rx="18" fill="url(#panel)" stroke="#0891b2" stroke-opacity=".28"/>
  <text x="68" y="120" fill="#0e7490" font-family="monospace" font-size="12" letter-spacing="2">01 / VISUAL.IDENTITY</text>
  
  <!-- Avatar Container Card -->
  <rect x="78" y="150" width="328" height="245" rx="14" fill="#f0f9ff" stroke="#cbd5e1"/>
  
  <g clip-path="url(#avatar-clip)">
    <!-- Light subtle grid -->
    <g opacity="0.12">
      <line x1="78" y1="210" x2="406" y2="210" stroke="#0891b2" stroke-width="0.7" stroke-dasharray="2,4"/>
      <line x1="78" y1="270" x2="406" y2="270" stroke="#0891b2" stroke-width="0.7" stroke-dasharray="2,4"/>
      <line x1="78" y1="330" x2="406" y2="330" stroke="#0891b2" stroke-width="0.7" stroke-dasharray="2,4"/>
      <line x1="160" y1="150" x2="160" y2="395" stroke="#0891b2" stroke-width="0.7" stroke-dasharray="2,4"/>
      <line x1="242" y1="150" x2="242" y2="395" stroke="#0891b2" stroke-width="0.7" stroke-dasharray="2,4"/>
      <line x1="324" y1="150" x2="324" y2="395" stroke="#0891b2" stroke-width="0.7" stroke-dasharray="2,4"/>
    </g>

